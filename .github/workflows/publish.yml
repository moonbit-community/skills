name: publish-package
run-name: publish skills ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-skills-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MOON_WORK: "off"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve release version
        id: release
        run: |
          case "$RELEASE_TAG" in
            v*) version="${RELEASE_TAG#v}" ;;
            *)
              echo "Release tag must use the v* format, got: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          manifest_version="$(awk -F'"' '/^version = / { print $2; exit }' moon.mod)"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag version $version does not match moon.mod version $manifest_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: |
          moon version --all
          moonrun --version

      - name: Update dependencies
        run: moon update

      - name: Check package
        run: |
          moon check --target wasm
          moon check --target native

      - name: Check generated interfaces
        run: |
          moon info --target wasm
          git diff --exit-code

      - name: Check formatting
        run: moon fmt --check

      - name: Build CLI
        run: |
          moon build --target wasm --release
          moon build --target native --release

      - name: Publish to Mooncakes
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "MOONCAKES_MOONBIT_COMMUNITY_TOKEN is required" >&2
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "skills $RELEASE_VERSION" \
            --generate-notes
