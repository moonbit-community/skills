name: publish-package
run-name: publish skills

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MOON_WORK: "off"
    outputs:
      published_tag: ${{ steps.prepublish.outputs.published_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Prepublish check
        id: prepublish
        run: |
          moon fmt
          git diff --exit-code
          moon check
          moon test
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          if [[ -z "$version" ]]; then
            echo "could not read package version from moon.mod" >&2
            exit 1
          fi
          echo "published_tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish to Mooncakes
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "MOONCAKES_MOONBIT_COMMUNITY_TOKEN is required" >&2
            exit 1
          fi
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon publish

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ needs.publish.outputs.published_tag }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$PUBLISHED_TAG" \
            -f sha="$GITHUB_SHA"
